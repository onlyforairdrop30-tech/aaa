version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_search_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app
    ports:
      - "8000:8000"
    networks:
      - college_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college_search_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - college_network

volumes:
  backend_data:

networks:
  college_network:
    driver: bridge

